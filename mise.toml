[tools]
bun = "1.4.5"
grype = "0.122.1"
trivy = "0.76.2"
uv = "0.13.10"

# ── Scanner tasks (Python via uv, scripts/scan_and_upload.py) ───

[tasks.scan]
description = "Scan all container images and print CVE summary"
run = "uv run --locked scripts/scan_and_upload.py scan"

[tasks."scan:upload"]
description = "Scan all images and upload results to DynamoDB (requires AWS credentials, e.g. AWS_PROFILE=my-aws)"
run = "uv run --locked scripts/scan_and_upload.py upload"

[tasks."scan:test"]
description = "Run the scanner tests (pytest, no Docker / AWS needed)"
run = "uv run --locked pytest"

# ── Web app tasks (Vite + Svelte in web/, run with Bun) ──────────

[tasks."web:install"]
description = "Install the dashboard dependencies (from bun.lock)"
run = "bun install --frozen-lockfile"
dir = "web"

[tasks."web:dev"]
description = "Start the dashboard dev server with hot reload"
run = "bun run dev"
dir = "web"
depends = ["web:install"]

[tasks."web:check"]
description = "Type-check the dashboard (svelte-check + tsc)"
run = "bun run check"
dir = "web"
depends = ["web:install"]

[tasks."web:test"]
description = "Run the dashboard tests (Vitest)"
run = "bun run test"
dir = "web"
depends = ["web:install"]

[tasks."web:build"]
description = "Build the dashboard to web/dist/"
run = "bun run build"
dir = "web"
depends = ["web:check"]
