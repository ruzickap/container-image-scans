---
name: nightly-scans

on:
  # schedule:
  #   # Run every day at midnight UTC
  #   - cron: "0 0 * * *"
  workflow_dispatch:

permissions: read-all

jobs:
  nightly-scans:
    name: Scan container images
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    permissions:
      contents: read # Required to checkout repository.
      id-token: write # Required to assume AWS role via OIDC.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.MY_AWS_AWS_ROLE_TO_ASSUME }}
          aws-region: eu-central-1

      - name: Install tools via mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Run scans and upload results
        run: mise run scan:upload
