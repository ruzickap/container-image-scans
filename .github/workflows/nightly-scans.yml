---
name: nightly-scans

on:
  schedule:
    # Run every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: read-all

# One run at a time (schedule + manual) - an older run must not overwrite the
# LATEST items of a newer one
concurrency:
  group: nightly-scans
  cancel-in-progress: false

jobs:
  nightly-scans:
    name: Scan container images
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 180
    permissions:
      contents: read # Required to checkout repository.
      id-token: write # Required to assume AWS role via OIDC.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.CONTAINER_IMAGE_SCANS_AWS_ROLE_TO_ASSUME }}
          aws-region: eu-central-1
          # Credentials valid for the whole run (timeout-minutes), the role allows max. 3 hours
          role-duration-seconds: 10800

      - name: Install the scanner tools via mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: grype trivy uv

      - name: Run scans and upload results
        run: mise run scan:upload
