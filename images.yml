    hummingbird:
      image: quay.io/hummingbird/nodejs:latest
      description: Red Hat Hardened Image (Project Hummingbird) - distroless
    suse:
      image: registry.suse.com/bci/nodejs:latest
      description: SUSE Base Container Image (BCI) on SUSE Linux Enterprise

