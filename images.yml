---
# Container images to scan:
#   group -> description + images -> vendor -> image + description
# - The vendor key is the column name on the dashboard
# - Only rolling tags (latest, alpine, slim, ...) - no version in the image
#   name or the descriptions, so the list never goes stale
# - scripts/scan-and-upload.sh reads this file directly; keep the image table
#   in README.md in sync

python:
  description: Python interpreter
  images:
    docker:
      image: docker.io/python:alpine
      description: Docker Official Image on Alpine Linux (musl)
    docker-slim:
      image: docker.io/python:slim
      description: Docker Official Image on Debian (slim variant)
    distroless:
      image: gcr.io/distroless/python3:latest
      description: Google distroless on Debian - no shell, no package manager
    chainguard:
      image: cgr.dev/chainguard/python:latest
      description: Chainguard Image on Wolfi OS - minimal, no shell
    hummingbird:
      image: quay.io/hummingbird/python:latest
      description: Red Hat Hardened Image (Project Hummingbird) - distroless

node:
  description: Node.js JavaScript runtime
  images:
    docker:
      image: docker.io/node:alpine
