    debian:
      image: docker.io/debian:stable-slim
      description: Debian stable - Docker Official Image (slim variant)
    ubuntu:
      image: docker.io/ubuntu:latest
      description: Ubuntu LTS - Docker Official Image
    amazonlinux:
      image: public.ecr.aws/amazonlinux/amazonlinux:latest
      description: Amazon Linux - official image from Amazon ECR Public
    distroless:
      image: gcr.io/distroless/static:latest
      description: Google distroless static - for static binaries, no libc
    chainguard:
      image: cgr.dev/chainguard/static:latest
      description: Chainguard static on Wolfi OS - for static binaries
    hummingbird:
      image: quay.io/hummingbird/core-runtime:latest
      description: Red Hat Hardened Image (Project Hummingbird) - minimal runtime
